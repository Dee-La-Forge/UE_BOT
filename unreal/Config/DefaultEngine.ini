; ---------------------------------------------------------------------------
; NOTE — ne jamais ecrire de crochets dans un commentaire de ce fichier.
;
; Une version anterieure listait ici, en commentaire, les sections retirees
; de l'ancien projet. L'analyseur d'Unreal a pris les crochets pour de vrais
; en-tetes de section, coupe le commentaire en deux et insere une section au
; milieu — produisant un INI invalide.
;
; Deux sections ont ete retirees le 28/07/2026 :
;
;   - Les reglages Convai et leur cle API en clair. Elle avait ete remise le
;     matin meme pour verifier la parite avec l'ancien projet ; le
;     ConvaiChatbotComponent ayant disparu des avatars, plus rien ne parle
;     aux serveurs Convai. Le plugin reste installe pour ses seules
;     animations MetaHuman, qui ne demandent aucune authentification.
;
;   - Le serveur de fichiers Android et son jeton de securite. Configuration
;     Android active dans une borne Windows : inutile, et inutilement
;     exposee.
;
;     La retirer d'ici ne suffisait pas : le plugin la regenerait a chaque
;     lancement, avec un jeton neuf. Il est desormais declare desactive dans
;     GardeFrontiere.uproject, ce qui est le seul endroit qui l'empeche de
;     revenir.
; ---------------------------------------------------------------------------

