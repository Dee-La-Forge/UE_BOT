[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Studio.Studio
EditorStartupMap=/Game/Studio.Studio

; ---------------------------------------------------------------------------
; Stabilite borne — repris de l'ancien projet, ou ces reglages avaient ete
; valides en exploitation. Le cap FPS n'est pas cosmetique : il limite la
; chaleur et l'usure sur un dispositif qui tourne 8 h/jour.
; ---------------------------------------------------------------------------

[ConsoleVariables]
t.MaxFPS=60

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True

; RT materiel desactive : Lumen bascule en software. Scene interieure fixe,
; le gain visuel ne justifie pas le cout thermique.
r.RayTracing=False
r.Lumen.HardwareRayTracing=0
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.RayTracing.Shadows=False
r.MegaLights.EnableForProject=False

r.Substrate=True
r.Substrate.ProjectGBufferFormat=0
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.ScreenPercentage.Default=100.000000
r.GPUSkin.Support16BitBoneIndex=True
r.GPUSkin.UnlimitedBoneInfluences=True

; PSO precaching : supprime les saccades de compilation shader en session.
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.PSOPrecache.GlobalComputeShaders=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
AudioSampleRate=48000
AudioCallbackBufferFrameSize=1024
AudioNumBuffersToEnqueue=1
AudioNumSourceWorkers=4

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.UserInterfaceSettings]
bAuthorizeAutomaticWidgetVariableCreation=False
FontDPIPreset=Standard
FontDPI=72

