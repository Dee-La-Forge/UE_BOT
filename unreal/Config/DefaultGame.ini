[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Garde Frontiere
ProjectVersion=2.0.0
Description=Dispositif museal — controle frontalier, IA locale

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bUseIoStore=True
bCompressed=True
PackageCompressionFormat=Oodle
PackageCompressionMethod=Kraken
IncludePrerequisites=True
IncludeCrashReporter=False
bSkipEditorContent=True

; L'experience est en francais : l'ancien projet embarquait "en", ce qui
; n'avait aucun effet utile.
InternationalizationPreset=EnglishFrench
-CulturesToStage=en
+CulturesToStage=fr

; Le repertoire de sortie ne doit PAS vivre dans le projet. L'ancien y
; laissait Export/ et Windows/, soit 5,2 Go de builds melanges aux sources.
StagingDirectory=(Path="../../../Builds")

[/Script/Engine.UserInterfaceSettings]
RenderFocusRule=Never
