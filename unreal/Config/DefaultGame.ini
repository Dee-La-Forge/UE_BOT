; ---------------------------------------------------------------------------
; NVIDIA ACE ASR — EN EVALUATION, PAS EN SERVICE.
;
; Le STT nominal reste faster-whisper, dans le sidecar. Ce plugin est
; installe et pointe sur le francais pour qu'il soit COMPARABLE sur la
; borne, rien de plus : aucun Blueprint n'appelle InitializeASRAsync, donc
; le module se charge et ne consomme ni VRAM ni temps.
;
; Le modele par defaut du plugin est l'anglais (English_Conformer_140M,
; livre dans l'archive). Sans cette ligne, une premiere evaluation aurait
; transcrit du francais avec un modele anglais et conclu — a tort — que
; Riva ne vaut rien. Le modele francais (conformer-fr-140m, 715 Mo) a ete
; installe a cote par le download.bat de NVIDIA.
;
; CE QUI RESTE A TRANCHER, et qui ne se tranche que SUR LA BORNE :
;   - la QUALITE sur des enonces courts en francais. 140M, la ou le projet
;     a deja abandonne whisper small pour cette raison exacte. C'est le
;     critere qui decide, pas la vitesse.
;   - la LATENCE reelle. Le backend GPU est TensorRT-RTX : une GTX 1060
;     retombe en DirectML ou CPU et ne mesure rien de representatif.
;
; L'interet n'est d'ailleurs pas la vitesse brute. Whisper transcrit PAR
; LOT, une fois le segment clos — les 820 a 1200 ms mesurees le sont
; entierement APRES que le visiteur s'est tu. Riva transcrit EN FLUX,
; pendant qu'il parle, et finalise apres le silence.
; ---------------------------------------------------------------------------

[/Script/ACE_ASR.ACEASRSettings]
DefaultModelPreset=French_Conformer_140M

