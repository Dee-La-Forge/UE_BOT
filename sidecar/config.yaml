# Sidecar IA locale — configuration
#
# Tout ce qui etait code en dur dans l'ancien projet vit ici.
# Modifiable sans recompiler quoi que ce soit.

serveur:
  hote: "127.0.0.1"
  port: 8765          # WebSocket expose a Unreal

stt:
  # faster-whisper sur GPU.
  #
  # Le CPU etait le choix initial, pour menager une VRAM qu'on croyait
  # comptee. La mesure a tranche : 1932 ms sur CPU contre 301 ms sur GPU
  # pour le meme modele, soit 6,4x. Le STT etait 90 % de la latence totale.
  #
  #   small / cuda / float16 :  301 ms
  #   base  / cuda / float16 :  100 ms   (transcription degradee)
  #   small / cpu  / int8    : 1932 ms
  #
  # Passe de small a medium le 29/07/2026 : small massacrait les enonces
  # courts en conditions reelles (« S'attu. », « pandinvestigation », « Je
  # le viens de Paris ») et l'agent repondait a du charabia. Le GPU a la
  # marge (46 % d'usage releve en session). A remesurer ; revenir a small
  # si la latence STT redevient le poste dominant.
  # base SUR CE POSTE, medium SUR LA BORNE.
  #
  # medium en int8 sur PROCESSEUR met plusieurs minutes a se charger — le
  # sidecar restait injoignable tout ce temps, et la borne avec. Or ce
  # poste n'a aucun micro : la qualite de transcription n'y sert a rien,
  # seule compte la rapidite de demarrage pour enchainer les essais.
  #
  # Sur la borne, medium est le bon choix et il est documente ci-dessous :
  # small massacrait les enonces courts en conditions reelles.
  modele: "base"      # tiny | base | small | medium | large-v3
  # cpu SUR CE POSTE, cuda SUR LA BORNE.
  #
  # La GTX 1060 n'a que 6 Go, et le rendu Unreal en consomme l'essentiel
  # des qu'une scene MetaHuman s'affiche : mesure le 30/07/2026, 4953 Mio
  # sur 6144 avec l'editeur SIMPLEMENT OUVERT. llama.cpp se faisait alors
  # evincer, et sa premiere generation passait de 1,9 s a plus de 31 s —
  # au-dela du delai d'abandon, la borne se fermait avant d'avoir parle.
  #
  # Whisper sur CPU rend ce gigaoctet au LLM. C'est plus lent a
  # transcrire, mais sur ce poste il n'y a de toute facon pas de micro.
  # La borne, elle, a 24 Go : y remettre cuda/float16.
  peripherique: "cpu"
  type_calcul: "int8"
  langue: "fr"
  # Amorce donnee a Whisper a chaque transcription. Sur un fragment court
  # et ambigu, le modele complete avec le vocabulaire de l'amorce plutot
  # qu'avec ses hallucinations d'entrainement (« Sous-titres realises par
  # la communaute d'Amara.org »).
  contexte: "Controle frontalier. Le visiteur decline son identite, le motif de sa visite, sa destination, ce qu'il transporte."
  # REMIS A true le 29/07/2026, apres l'avoir coupe le matin meme.
  #
  # Je l'avais desactive en constatant « VAD filter removed 00:00.000 of
  # audio » a chaque tour : il ne retirait rien, donc il paraissait inutile.
  # C'etait mal lire ce que fait ce filtre. Il ne sert pas qu'a rogner les
  # bords : il segmente le signal et concentre la transcription sur les
  # regions de parole. Sans lui, Whisper transcrit tout le tampon, bruit
  # compris, et comble les vides par ses hallucinations d'entrainement —
  # « Merci d'avoir regarde », « C'est de l'eau, pas de maitres ».
  #
  # Une mesure qui montre zero n'est pas la preuve qu'un composant ne sert
  # a rien : elle mesurait autre chose que ce qu'il fait.
  vad_filtre: true

llm:
  # llama.cpp server, lance separement — voir scripts/setup.ps1
  url: "http://127.0.0.1:8080"
  # Sert d'etiquette dans le journal de mesures ; le modele reellement
  # charge est celui passe a scripts/lancer_llm.ps1. Garder les deux
  # accordes, sinon les releves de benchmarks/latence.jsonl mentent.
  modele: "qwen2.5-3b-instruct-q4_k_m.gguf"
  # Gabarit de prompt, A ACCORDER AU MODELE ci-dessus :
  #   chatml   Qwen
  #   mistral  Mistral, NeMo Minitron et derives ([INST])
  # Se tromper ne leve aucune erreur : le modele repond a cote, et on
  # accuse le modele alors que c'est le gabarit. Releve en essai reel avec
  # Minitron servi en ChatML — reponses hors sujet, agent jouant le role
  # du visiteur.
  gabarit: "chatml"
  temperature: 0.7
  top_p: 0.9
  max_tokens: 200
  # Penalite de repetition. llama.cpp ne l'applique pas par defaut, et
  # sous grammaire contrainte le modele remplit par repetition jusqu'au
  # plafond de caracteres plutot que de conclure. 1.15 sur les 256
  # derniers jetons : assez pour casser la boucle, pas assez pour
  # l'empecher de reutiliser le vocabulaire du poste frontiere.
  penalite_repetition: 1.15
  # ESSAYEE a 1024 le 31/07/2026, puis REMISE a 256. La mesure a tranche
  # contre moi.
  #
  # Le raisonnement paraissait solide : llama.cpp compte les derniers N
  # jetons du CONTEXTE, prompt compris, donc 256 ne couvrait guere plus que
  # la replique precedente et ne pouvait pas penaliser les ouvertures d'il
  # y a trois tours. Elargir devait donc casser le tic.
  #
  # Ca l'a casse — et abime le francais avec. La penalite ne distingue pas
  # un tic d'un mot courant : sur 1024 jetons elle frappe aussi les
  # articles, les verbes ordinaires et le vocabulaire du poste, et le
  # modele part chercher ailleurs. Releve dans la meme execution :
  # « Contrefacons, Victor, motifs ambigues », « intrusion territorial »,
  # « repondons-en ».
  #
  # Le tic se traite par le PROMPT — la liste litterale des ouvertures deja
  # employees, voir _etat_courant dans pipeline.py — qui vise le debut de
  # replique et lui seul. Un instrument precis vaut mieux qu'un large.
  fenetre_repetition: 256
  # Attente maximale ENTRE DEUX morceaux du flux. Avant le premier, le
  # modele evalue le prompt sans rien emettre : a froid, sur un GPU
  # modeste, cela depasse largement 20 s. A garder coherent avec
  # DelaiPremiereReponse cote Unreal (30 s).
  delai_lecture: 45.0
  # Contraignent le format de sortie : texte parle, puis tags emotion/verdict.
  # La bascule entre les trois est pilotee par le nombre de questions posees
  # (voir pipeline.py) — le plancher et le plafond du Narrative Design
  # deviennent ainsi grammaticalement infaillibles.
  grammaires:
    entretien: "grammars/entretien.gbnf"   # verdict interdit  (< questions_min)
    verdict: "grammars/verdict.gbnf"       # verdict autorise
    cloture: "grammars/cloture.gbnf"       # verdict impose    (>= questions_max)

tts:
  # piper | chatterbox
  #
  #   piper       ~60 Mo, CPU, tres rapide. Sobre et sur — mais la voix
  #               fr_FR-siwis est mecanique, « trop robotique » pour le
  #               personnage (releve a l'ecoute le 30/07/2026).
  #   chatterbox  350 M parametres, GPU de preference. Voix incarnee, et
  #               surtout CLONAGE : voir echantillon_voix ci-dessous.
  #               Licence MIT.
  # VOIX CLONEE — c'est la voix du dispositif, pas un reglage de confort.
  #
  # Choisie et validee a l'ecoute le 30/07/2026 : les voix generiques des
  # modeles sont inutilisables (accent americain pour la turbo, canadien
  # pour la multilingue), et Piper est mecanique. L'humanite vient de
  # l'echantillon, pas du moteur.
  #
  # SUR CE POSTE, C'EST INUTILISABLE, et il faut le savoir avant d'essayer :
  # mesure du 31/07/2026, 383 s de calcul pour 7,7 s de parole — x0,02 du
  # temps reel, soit plus de six minutes pour l'accueil. La 1060 n'a pas la
  # VRAM libre (llama.cpp l'occupe) et Chatterbox retombe sur le
  # processeur. La borne, avec ses 24 Go, est le seul endroit ou cette
  # configuration se juge.
  #
  # POUR TESTER LOCALEMENT, une ligne suffit — remettre :
  #     moteur: "piper"
  # avec voix: "fr_FR-tom-medium" (masculine ; siwis est feminine, ce qui
  # ne convient pas au personnage).
  moteur: "chatterbox-multi"

  # --- Piper ---
  # VOIX MASCULINE — et c'est un pis-aller assume SUR CE POSTE.
  #
  # La voix voulue pour Macerio est une VOIX CLONEE (chatterbox +
  # tts.echantillon_voix), validee a l'ecoute le 30/07/2026. Elle est
  # inutilisable ici : mesure du 31/07/2026, 383 s de calcul pour 7,7 s de
  # parole, soit x0,02 du temps reel. La 1060 n'a pas la VRAM libre —
  # llama.cpp l'occupe — et Chatterbox retombe sur le processeur. Sur la
  # borne (3090 Ti, 24 Go) ce chiffre n'a rien a voir.
  #
  # En attendant, Piper. Mais fr_FR-siwis-medium est une voix FEMININE,
  # alors que Macerio est un garde masculin joue par un MetaHuman masculin :
  # la borne parlait d'une voix qui ne pouvait pas etre la sienne, et
  # personne ne l'avait releve de toute la mise au point.
  #
  # Trois voix masculines francaises etaient deja telechargees :
  #
  #   fr_FR-tom-medium     44 100 Hz   8,96 s sur l'accueil   RETENUE
  #   fr_FR-gilles-low     16 000 Hz  12,21 s   qualite « low », diction lente
  #   fr_FR-upmc-medium    22 050 Hz   7,16 s   multi-locuteur, genre du
  #                                             locuteur par defaut incertain
  #
  # ATTENTION AU TAUX : tom sort en 44 100 Hz, le double de siwis. Rien
  # n'est code en dur — le champ `taux` du descripteur parole.audio fait
  # foi, et SidecarClient le lit dynamiquement (TauxAudioAttendu). C'est
  # justement pour cela que ce champ existe. A verifier en session reelle :
  # aucune trame ne doit etre rejetee.
  #
  # SUR LA BORNE, remettre le clonage :
  #   moteur: "chatterbox-multi"
  #   echantillon_voix: "voix/homme_ref.wav"
  voix: "fr_FR-tom-medium"
  vitesse: 1.0
  volume: 1.0

  # --- Chatterbox ---
  # WAV d'une dizaine de secondes : la voix que prendra l'agent.
  #
  # C'EST LUI QUI FAIT TOUT. Essai du 30/07/2026 : les voix generiques
  # des modeles sont inutilisables (accent americain pour la turbo,
  # canadien pour la multilingue) ; clonees sur un echantillon humain,
  # elles sont jugees « parfaites ». L'humanite vient de l'echantillon,
  # pas du moteur.
  #
  # Les echantillons ne sont PAS versionnes (voir .gitignore) : ce sont
  # des enregistrements de personnes, et le depot est public. Ils vivent
  # dans sidecar/voix/ sur la machine, et nulle part ailleurs.
  #
  # homme_ref.wav est la voix de l'agent en poste. femme_ref.wav est celle
  # du SECOND avatar, apres substitution — elle n'est pas encore branchee :
  # le sidecar n'a aujourd'hui qu'une seule voix chargee et ignore meme
  # quel avatar est en scene. Faire suivre la voix a l'avatar demande
  # qu'Unreal annonce l'avatar courant, donc une evolution du contrat.
  echantillon_voix: "voix/homme_ref.wav"
  #
  # 0 = diction neutre. Monter donne un jeu plus appuye — un
  # garde-frontiere n'a pas a surjouer.
  exageration: 0.0
  # auto | cuda | cpu. auto prend le GPU s'il y en a un, et retombe sur
  # CPU si le chargement echoue (VRAM prise par le rendu Unreal).
  peripherique: "auto"
  # (la cle `phonemes_pour_repli` — alignements pour le lipsync de repli par
  # visemes MHF_* — est RETIREE avec tout son chemin : le lipsync vient
  # d'Audio2Face, cote Unreal. La remettre a true fait refuser le demarrage,
  # volontairement.)

# Le bloc `lipsync:` (NeuroSync + repli visemes) a ete retire le 30/07/2026 :
# aucune de ses cles n'etait lue par le code, NeuroSync ne repond pas a
# l'audio (checkpoint divergent) et le chemin visemes a ete supprime. Le
# lipsync est assure par Audio2Face, entierement cote Unreal.

scenario:
  fichier: "scenario/agent.yaml"
  # L'agent RECITE son accueil au lieu de le generer.
  #
  # La phrase est scenario/agent.yaml -> repli.accueil, ecrite pour le
  # personnage : « Macerio, controle frontalier. Declinez votre identite. »
  #
  # Pourquoi la reciter : l'intro etait generee sous entretien.gbnf, la
  # seule grammaire disponible a zero question. Cette grammaire impose
  # « (reaction) question? ». A l'intro il n'y a rien a quoi reagir, et le
  # modele remplissait le creneau vide avec le soupcon de la persona —
  # « vous mentez... » aux trois sessions du 31/07/2026, avant que le
  # visiteur ait ouvert la bouche. Elle interdit aussi l'imperatif que le
  # scenario demande : la consigne et la contrainte se contredisaient.
  #
  # C'est le seul tour de parole que TOUT visiteur entend. Le reciter le
  # rend identique a chaque session et retire une variable de la chaine
  # pendant qu'on valide le reste. Repasser a false rend la main au modele
  # — a faire quand intro.gbnf existera, aux finitions.
  intro_fixe: true
  # Le nombre de questions (min/max) vit dans scenario/agent.yaml
  # (interrogatoire.questions_min/max) — source de verite unique. Les delais
  # visiteur (reponse, abandon) vivent cote Unreal : DelaiReponseVisiteur et
  # DelaiAbandon sur AGuardSessionManager.

mesures:
  # Chronometrage de chaque etage — c'est l'objet du prototype
  actif: true
  fichier_sortie: "../benchmarks/latence.jsonl"
